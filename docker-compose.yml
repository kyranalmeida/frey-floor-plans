services:
  db:
    image: mysql:8.0
    container_name: frey_wp_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wp_user
      MYSQL_PASSWORD: wp_password
      MYSQL_ROOT_PASSWORD: root_password
    volumes:
      - db_data:/var/lib/mysql

  wordpress:
    image: wordpress:6.6-php8.2-apache
    container_name: frey_wp_app
    depends_on:
      - db
    ports:
      - "8080:80"
    restart: unless-stopped
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: wp_user
      WORDPRESS_DB_PASSWORD: wp_password
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DEBUG: 1
    volumes:
      - wp_data:/var/www/html
      - ./theme:/var/www/html/wp-content/themes/frey-floor-plans

  wpcli:
    image: wordpress:cli-php8.2
    container_name: frey_wp_cli
    depends_on:
      - wordpress
    volumes:
      - wp_data:/var/www/html
      - ./theme:/var/www/html/wp-content/themes/frey-floor-plans
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: wp_user
      WORDPRESS_DB_PASSWORD: wp_password
      WORDPRESS_DB_NAME: wordpress

volumes:
  db_data:
  wp_data:
